# Fork-only: builds the fork's frontend and backend images whenever the pt-br branch
# changes. Run both together: the fork's frontend expects the fork's backend.
name: Publish pt-BR images to GHCR

on:
  push:
    branches: ['pt-br']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read upstream version
        id: version
        run: echo "value=$(node -p "require('./frontend/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mailflow-frontend
          tags: |
            type=raw,value=pt-br
            type=raw,value=${{ steps.version.outputs.value }}-pt-br

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          provenance: false
          build-args: |
            VITE_BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mailflow-backend
          tags: |
            type=raw,value=pt-br
            type=raw,value=${{ steps.version.outputs.value }}-pt-br

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          provenance: false
          build-args: |
            BUILD_SHA=${{ github.sha }}
            APP_VERSION=v${{ steps.version.outputs.value }}-pt-br
          cache-from: type=gha
          cache-to: type=gha,mode=max
